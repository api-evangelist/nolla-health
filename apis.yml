aid: nolla-health
name: Nolla Health
description: >-
  Nolla Health is a Norway-born, AI-powered telehealth and dermatology company
  that entered the U.S. market with a $4.5M seed round led by General Catalyst
  and set up its headquarters in New York City. After treating more than 50,000
  patients in Europe and becoming one of Norway's top-five medical apps, Nolla
  launched an AI-guided skin and acne care platform across 40+ U.S. states. The
  service pairs proprietary AI symptom assessment with clinician-in-the-loop
  oversight: patients complete a guided chat, a licensed U.S. medical provider
  reviews and approves every diagnosis and prescription, and topical
  medications are shipped directly to the patient. Nolla operates as a
  consumer-facing product (per-consultation and a monthly subscription) rather
  than an API provider, and publicly states HIPAA and GDPR compliance.
